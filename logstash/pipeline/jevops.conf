input {
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  if ![service] {
    mutate { add_field => { "service" => "unknown" } }
  }
  if ![level] and ![levelname] {
    mutate { add_field => { "level" => "INFO" } }
  }
  if ![@timestamp] and [time] {
    date {
      match => [ "time", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS" ]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://${ES_HOST}:9200"]
    index => "logs-%{+YYYY.MM.dd}"
  }
  http {
    url => "${JEVOPS_URL}/ingest"
    http_method => "post"
    content_type => "application/json"
    format => "message"
    message => "%{[message]}"
    mapping => { "[@timestamp]" => "%{[@timestamp]}", "service" => "%{[service]}", "env" => "%{[env]}", "level" => "%{[level]}", "message" => "%{[message]}" }
  }
}
